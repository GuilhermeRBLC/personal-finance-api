version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: finance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-network

  backend-api:
    build:
      context: . # backend
      dockerfile: Dockerfile
    container_name: finance-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/finance_db
      DB_USER: postgres
      DB_PASSWORD: root
      JWT_SECRET: chave-super-secreta-para-o-docker
    depends_on:
      - postgres-db
    networks:
      - finance-network

  frontend-angular:
    build:
      context: ../personal-finance-web # frontend
      dockerfile: Dockerfile
    container_name: finance-frontend
    ports:
      - "80:80"
    environment:
      API_URL: http://localhost:8080
    depends_on:
      - backend-api
    networks:
      - finance-network

volumes:
  postgres_data:

networks:
  finance-network:
    driver: bridge